server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static security headers applied to every response. CSP is dynamic
  # (Jellyfin / *arr URLs vary per deployment) so it lives in
  # /etc/nginx/conf.d/glassfin-csp.conf, generated by docker-entrypoint.sh
  # from runtime env vars and included below.
  #
  # X-Content-Type-Options: stop browsers from MIME-sniffing responses.
  # X-Frame-Options: disallow framing — clickjacking defence (CSP
  # frame-ancestors does the same modern job, both are set for old browsers).
  # Referrer-Policy: only send origin on cross-origin nav, no path leak.
  # Permissions-Policy: deny powerful APIs we don't use; PiP and fullscreen
  # are explicitly allowed because the player needs them.
  # Strict-Transport-Security: only meaningful over HTTPS deployments — sent
  # always so once a user is on HTTPS, the browser pins it.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=(), fullscreen=(self), picture-in-picture=(self)" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  include /etc/nginx/conf.d/glassfin-csp.conf;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # /version.json is generated at container start with build metadata. Used
  # by ops dashboards and the in-app About page to confirm what's deployed.
  location = /version.json {
    add_header Cache-Control "no-store";
    add_header Content-Type application/json;
    try_files /version.json =404;
  }

  # Runtime config script — never cached so re-deploys with different env
  # vars take effect on next page load. Network-first behaviour in the
  # service worker also covers this, but a no-store header upstream is
  # belt-and-braces.
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files /config.js =404;
  }

  # SPA fallback: any non-asset path returns index.html so client-side
  # routing works on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are content-addressed by Vite — safe to cache for a
  # year. The Cache-Control here re-asserts the static security headers
  # because nginx's `add_header` doesn't inherit into nested locations.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }
}
